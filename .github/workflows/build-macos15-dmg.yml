name: Build macOS 15 (.app & .dmg) Installer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "是否同时创建 GitHub Release 发布 macOS 安装包"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  build-macos15-installer:
    name: Build macOS 15 Native App & DMG
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with Tkinter Support
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install macOS Packaging Dependencies
        run: |
          brew install portaudio python-tk@3.12 || true
          python3 -m pip install --upgrade pip
          python3 -m pip install google-genai numpy sounddevice pillow pyinstaller

      - name: Generate Custom macOS 15 AppIcon.icns via sips & iconutil
        run: |
          mkdir -p build_bin/AppIcon.iconset
          if [[ -f "AppIcon.png" ]]; then cp AppIcon.png build_bin/AppIcon_1024.png; else python3 macos15_gemini_live_subtitle.py --generate-icon build_bin/AppIcon_1024.png; fi
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz build_bin/AppIcon_1024.png --out "build_bin/AppIcon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -z $sz2 $sz2 build_bin/AppIcon_1024.png --out "build_bin/AppIcon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns build_bin/AppIcon.iconset -o build_bin/AppIcon.icns
          ls -lh build_bin/AppIcon.icns

      - name: Compile Native macOS 15 ScreenCaptureKit Audio Helper (Swift)
        run: |
          mkdir -p build_bin
          python3 - << 'EOF'
          import pathlib
          import macos15_gemini_live_subtitle as app
          out = pathlib.Path("build_bin/sck_audio_helper.swift")
          out.write_text(app.SWIFT_SCK_SOURCE, encoding="utf-8")
          EOF
          swiftc -O build_bin/sck_audio_helper.swift \
            -o build_bin/sck_audio_helper \
            -framework ScreenCaptureKit \
            -framework CoreMedia \
            -framework AVFoundation \
            -framework Foundation
          chmod +x build_bin/sck_audio_helper

      - name: Run Automated Core Algorithm Self-Test
        run: |
          python3 macos15_gemini_live_subtitle.py --self-test

      - name: Generate Single-Executable PyInstaller Spec with Custom AppIcon.icns
        run: |
          cat << 'EOF' > GeminiLiveSubtitle.spec
          # -*- mode: python ; coding: utf-8 -*-
          block_cipher = None

          a = Analysis(
              ['macos15_gemini_live_subtitle.py'],
              pathex=[],
              binaries=[('build_bin/sck_audio_helper', 'bin')],
              datas=[],
              hiddenimports=['google.genai', 'numpy', 'sounddevice'],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=['pytest', 'unittest', 'pydoc', 'doctest', 'pip', 'setuptools', 'PIL'],
              noarchive=False,
          )
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              [],
              name='GeminiLiveSubtitle',
              debug=False,
              bootloader_ignore_signals=False,
              strip=True,
              upx=False,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              icon='build_bin/AppIcon.icns',
          )
          app = BUNDLE(
              exe,
              name='GeminiLiveSubtitle.app',
              icon='build_bin/AppIcon.icns',
              bundle_identifier='com.gemini.macos15.livesubtitle',
              info_plist={
                  'CFBundleName': 'Gemini 3.5 Live 实时字幕',
                  'CFBundleDisplayName': 'Gemini 3.5 Live 实时字幕',
                  'CFBundleIconFile': 'AppIcon.icns',
                  'CFBundleShortVersionString': '1.3.1',
                  'CFBundleVersion': '1.3.1',
                  'LSMinimumSystemVersion': '13.0',
                  'NSHighResolutionCapable': True,
                  'NSScreenCaptureUsageDescription': '需要录屏与系统录音权限以通过 macOS 15 ScreenCaptureKit 直接捕获系统桌面音频并生成实时中文字幕。',
                  'NSMicrophoneUsageDescription': '需要音频输入权限以支持从 BlackHole 或音频输入设备捕获实时音频进行翻译。',
                  'NSAppTransportSecurity': {'NSAllowsArbitraryLoads': True},
              },
          )
          EOF

      - name: Build Pure Binary macOS .app Bundle & Strip Any Residual .py Files
        run: |
          pyinstaller --noconfirm --clean GeminiLiveSubtitle.spec
          find "dist/GeminiLiveSubtitle.app" -type f -name "*.py" -delete
          codesign --force --deep --sign - "dist/GeminiLiveSubtitle.app"

      - name: Package Pure .app into macOS .dmg Disk Image
        run: |
          mkdir -p dmg_staging
          cp -R "dist/GeminiLiveSubtitle.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          DMG_NAME="GeminiLiveSubtitle-macOS15.dmg"
          hdiutil create \
            -volname "Gemini 3.5 Live 实时字幕" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "${DMG_NAME}"
          shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256"

      - name: Upload Compiled macOS .dmg Installer to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveSubtitle-macOS15-Installer
          path: |
            GeminiLiveSubtitle-macOS15.dmg
            GeminiLiveSubtitle-macOS15.dmg.sha256
          retention-days: 30

      - name: Publish macOS .dmg Installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.1' }}
          name: "Gemini 3.5 Live Translate macOS 15 实时字幕安装包 (v1.3.1)"
          body: |
            ### Gemini 3.5 Live Translate · macOS 15 (Sequoia) 实时系统音频中文字幕安装包 (v1.3.1)
            - **全新专属 macOS 15 应用图标 (`AppIcon.icns`)**：极光声波与悬浮字幕胶囊设计。
            - **自动记忆字幕位置**：拖动字幕后自动保存屏幕坐标，下次启动直接固定在上次摆放的位置。
            - **单排逐句刷新 + 弱音自动放大 (Smart AGC) + 5 秒无语音自动清空**。
          files: |
            GeminiLiveSubtitle-macOS15.dmg
            GeminiLiveSubtitle-macOS15.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
